<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Grid Patterns</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="controls">
    <div class="row">
      <label for="seed">Seed:</label>
      <input id="seed" type="text" placeholder="(auto)">
      <button id="regenerate" type="button">Regenerate</button>
    </div>
    <div class="color-group">
      <input id="color-a" type="color" value="#498fb2">
      <span class="name">A &mdash; top</span>
      <code class="hex" id="hex-a"></code>
      <div class="swatches">
        <span class="swatch color-a-0"></span>
        <span class="swatch color-a-1"></span>
        <span class="swatch color-a-2"></span>
        <span class="swatch color-a-3"></span>
        <span class="swatch color-a-4"></span>
      </div>
    </div>
    <div class="color-group">
      <input id="color-b" type="color" value="#74a64a">
      <span class="name">B &mdash; bottom-right</span>
      <code class="hex" id="hex-b"></code>
      <div class="swatches">
        <span class="swatch color-b-0"></span>
        <span class="swatch color-b-1"></span>
        <span class="swatch color-b-2"></span>
        <span class="swatch color-b-3"></span>
        <span class="swatch color-b-4"></span>
      </div>
    </div>
    <div class="color-group">
      <input id="color-c" type="color" value="#8b79d0">
      <span class="name">C &mdash; top-left</span>
      <code class="hex" id="hex-c"></code>
      <div class="swatches">
        <span class="swatch color-c-0"></span>
        <span class="swatch color-c-1"></span>
        <span class="swatch color-c-2"></span>
        <span class="swatch color-c-3"></span>
        <span class="swatch color-c-4"></span>
      </div>
    </div>
    <div class="row">
      <label for="scale">Variation:</label>
      <input id="scale" type="range" min="0" max="2" step="0.05" value="1">
      <span id="scale-value">1.00</span>
    </div>
  </div>
  <div id="grid"></div>

  <script src="rng.js"></script>
  <script src="grid.js"></script>
  <script src="main.js"></script>
</body>
</html>
